# Quick check (about a minute): compiles every host shader listed in gpu/CMakeLists.txt with the
# same glslang options as the build, plus the HDR library checks (host_shaders/hdr/*_check.frag),
# so a shader error shows up before the full Windows build. The result is an annotation.
name: Shader check

on:
  push:
    branches: [windows, 'hdr*']
    paths: ['gpu/shadps4/video_core/host_shaders/**', 'gpu/CMakeLists.txt', 'docs/hdr-tools/upscale_transfer_check/**', '.github/workflows/shader-check.yml']
  workflow_dispatch:

jobs:
  glslang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shader tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools spirv-tools spirv-cross libglm-dev g++
      - name: Compile the host shaders
        run: |
          src=gpu/shadps4/video_core/host_shaders
          out=$(mktemp -d)
          ok=0; failed=0
          compile() { # <label> <glslang arguments...>
            local label=$1; shift
            if glslangValidator --target-env vulkan1.3 "$@" > "$out/log.txt" 2>&1; then
              ok=$((ok + 1))
            else
              failed=$((failed + 1))
              echo "::error title=Shader $label::$(tr '\n' ' ' < "$out/log.txt" | cut -c1-900)"
            fi
          }
          # add_host_shader(<file> <name> [DEFINE=VALUE ...])
          while read -r file name defines; do
            args=()
            for d in $defines; do args+=("-D$d"); done
            compile "$file ($name)" -o "$out/$name.h" --vn "${name^^}" "${args[@]}" "$src/$file"
          done < <(grep -E '^add_host_shader\(' gpu/CMakeLists.txt | sed -E 's/^add_host_shader\((.*)\)$/\1/')
          for check in "$src"/hdr/*_check.frag; do
            compile "$check" -o "$out/check.spv" "$check"
          done
          echo "::notice title=Shader check::$ok compiled, $failed failed"
          [[ $ok -gt 0 && $failed -eq 0 ]]
      - name: SPIRV-Cross CPU support headers
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/SPIRV-Cross
          ref: 300681bbcb8365a8d1eacdacdbdd0249bbf1d6b1
          path: .ci/spirv-cross
          sparse-checkout: include
      - name: Mode 5 linear-light transfer regression
        env:
          SPIRV_CROSS_INCLUDE: ${{ github.workspace }}/.ci/spirv-cross/include
        run: python3 -I docs/hdr-tools/upscale_transfer_check/run.py
